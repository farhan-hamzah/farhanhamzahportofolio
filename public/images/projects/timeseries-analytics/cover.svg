<svg width="800" height="480" viewBox="0 0 800 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="480" rx="32" fill="#FBF8EE"/>
  
  <!-- Subtle Grid Pattern in Background -->
  <g opacity="0.08">
    <line x1="80" y1="100" x2="720" y2="100" stroke="#1F4B3F" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="80" y1="180" x2="720" y2="180" stroke="#1F4B3F" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="80" y1="260" x2="720" y2="260" stroke="#1F4B3F" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="80" y1="340" x2="720" y2="340" stroke="#1F4B3F" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="160" y1="70" x2="160" y2="410" stroke="#1F4B3F" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="320" y1="70" x2="320" y2="410" stroke="#1F4B3F" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="480" y1="70" x2="480" y2="410" stroke="#1F4B3F" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="640" y1="70" x2="640" y2="410" stroke="#1F4B3F" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- Main Card Container -->
  <rect x="56" y="48" width="688" height="384" rx="24" fill="#FFFFFF" stroke="#E5DEC9" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Header Section -->
  <g id="header">
    <rect x="80" y="74" width="168" height="28" rx="14" fill="#E8F1EC"/>
    <circle cx="94" cy="88" r="4" fill="#245A4A"/>
    <text x="106" y="92" fill="#245A4A" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="0.08em">TIME-SERIES ML</text>
    
    <text x="260" y="93" fill="#6B7280" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">Predictive Analytics &amp; Feature Engine</text>
    
    <!-- Status Pill -->
    <rect x="584" y="74" width="136" height="28" rx="14" fill="#F4EFE0"/>
    <text x="604" y="92" fill="#1F4B3F" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Enterprise Solution</text>
  </g>

  <!-- Left: Time-Series Chart Box -->
  <g id="chart-panel">
    <rect x="80" y="118" width="410" height="226" rx="18" fill="#FAF7EE" stroke="#EAE2CC" stroke-width="1.2"/>
    
    <!-- Horizontal Grid Lines inside chart -->
    <line x1="104" y1="160" x2="466" y2="160" stroke="#E2D9BF" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="104" y1="210" x2="466" y2="210" stroke="#E2D9BF" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="104" y1="260" x2="466" y2="260" stroke="#E2D9BF" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="104" y1="310" x2="466" y2="310" stroke="#E2D9BF" stroke-width="1"/>

    <!-- Prediction Confidence Interval Band (Area) -->
    <path d="M 330 196 Q 370 170 410 162 T 466 148 L 466 230 Q 410 220 370 216 Z" fill="#2E705B" fill-opacity="0.12"/>
    
    <!-- Historical Trend Area Gradient -->
    <path d="M 110 282 L 140 260 L 170 270 L 205 220 L 240 235 L 275 190 L 305 205 L 330 182 L 330 310 L 110 310 Z" fill="url(#historicalGrad)" opacity="0.3"/>
    
    <!-- Historical Actuals Line -->
    <path d="M 110 282 L 140 260 L 170 270 L 205 220 L 240 235 L 275 190 L 305 205 L 330 182" stroke="#1F4B3F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Historic Data Points -->
    <circle cx="110" cy="282" r="4" fill="#FFFFFF" stroke="#1F4B3F" stroke-width="2"/>
    <circle cx="140" cy="260" r="4" fill="#FFFFFF" stroke="#1F4B3F" stroke-width="2"/>
    <circle cx="170" cy="270" r="4" fill="#FFFFFF" stroke="#1F4B3F" stroke-width="2"/>
    <circle cx="205" cy="220" r="4" fill="#FFFFFF" stroke="#1F4B3F" stroke-width="2"/>
    <circle cx="240" cy="235" r="4" fill="#FFFFFF" stroke="#1F4B3F" stroke-width="2"/>
    <circle cx="275" cy="190" r="4" fill="#FFFFFF" stroke="#1F4B3F" stroke-width="2"/>
    <circle cx="305" cy="205" r="4" fill="#FFFFFF" stroke="#1F4B3F" stroke-width="2"/>
    <circle cx="330" cy="182" r="5" fill="#2E705B" stroke="#FFFFFF" stroke-width="2"/>

    <!-- Cutoff Horizon Line -->
    <line x1="330" y1="134" x2="330" y2="310" stroke="#B87333" stroke-width="1.5" stroke-dasharray="4 3"/>
    <rect x="306" y="130" width="48" height="16" rx="8" fill="#B87333"/>
    <text x="314" y="142" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700">NOW</text>

    <!-- Forecasted Future Line (Dashed) -->
    <path d="M 330 182 Q 365 160 405 174 T 466 156" stroke="#2E705B" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4"/>
    
    <!-- Forecast Points -->
    <circle cx="370" cy="168" r="4" fill="#2E705B"/>
    <circle cx="415" cy="172" r="4" fill="#2E705B"/>
    <circle cx="466" cy="156" r="4" fill="#2E705B"/>

    <!-- Small Chart Legend -->
    <text x="108" y="142" fill="#717D75" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">HISTORICAL TIME-SERIES</text>
    <text x="365" y="142" fill="#2E705B" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">PREDICTION HORIZON</text>
  </g>

  <!-- Right: Model & Pipeline Stats Panel -->
  <g id="stats-panel">
    <!-- Stat 1: Feature Engineering -->
    <g transform="translate(506, 118)">
      <rect width="214" height="66" rx="14" fill="#FAF7EE" stroke="#EAE2CC" stroke-width="1.2"/>
      <circle cx="28" cy="33" r="14" fill="#E8F1EC"/>
      <path d="M 23 33 L 33 33 M 28 28 L 28 38" stroke="#1F4B3F" stroke-width="2" stroke-linecap="round"/>
      <text x="50" y="27" fill="#6B7280" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" text-transform="uppercase">Feature Engineering</text>
      <text x="50" y="47" fill="#1F4B3F" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Lags &amp; Rolling Stats</text>
    </g>

    <!-- Stat 2: Model Architecture -->
    <g transform="translate(506, 198)">
      <rect width="214" height="66" rx="14" fill="#FAF7EE" stroke="#EAE2CC" stroke-width="1.2"/>
      <circle cx="28" cy="33" r="14" fill="#E8F1EC"/>
      <path d="M 23 37 L 27 28 L 31 34 L 35 27" stroke="#1F4B3F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="50" y="27" fill="#6B7280" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" text-transform="uppercase">Model Optimization</text>
      <text x="50" y="47" fill="#1F4B3F" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">LightGBM &amp; Ensembles</text>
    </g>

    <!-- Stat 3: Scale & Reliability -->
    <g transform="translate(506, 278)">
      <rect width="214" height="66" rx="14" fill="#FAF7EE" stroke="#EAE2CC" stroke-width="1.2"/>
      <circle cx="28" cy="33" r="14" fill="#E8F1EC"/>
      <circle cx="28" cy="33" r="6" stroke="#1F4B3F" stroke-width="2"/>
      <text x="50" y="27" fill="#6B7280" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" text-transform="uppercase">Evaluation Strategy</text>
      <text x="50" y="47" fill="#1F4B3F" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Multi-Model Benchmarking</text>
    </g>
  </g>

  <!-- Bottom: Processing Pipeline Flow -->
  <g id="bottom-pipeline" transform="translate(80, 360)">
    <rect width="640" height="52" rx="14" fill="#FAF7EE" stroke="#EAE2CC" stroke-width="1.2"/>
    
    <!-- Step 1 -->
    <circle cx="36" cy="26" r="10" fill="#1F4B3F"/>
    <text x="36" y="29.5" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">1</text>
    <text x="54" y="23" fill="#1F4B3F" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">Ingestion</text>
    <text x="54" y="36" fill="#717D75" font-family="system-ui, -apple-system, sans-serif" font-size="9">Large-Scale Data</text>

    <!-- Arrow 1 -->
    <path d="M 148 26 L 164 26 M 160 22 L 164 26 L 160 30" stroke="#A8A28E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Step 2 -->
    <circle cx="196" cy="26" r="10" fill="#1F4B3F"/>
    <text x="196" y="29.5" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">2</text>
    <text x="214" y="23" fill="#1F4B3F" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">Transformation</text>
    <text x="214" y="36" fill="#717D75" font-family="system-ui, -apple-system, sans-serif" font-size="9">Time-Series Features</text>

    <!-- Arrow 2 -->
    <path d="M 324 26 L 340 26 M 336 22 L 340 26 L 336 30" stroke="#A8A28E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Step 3 -->
    <circle cx="372" cy="26" r="10" fill="#1F4B3F"/>
    <text x="372" y="29.5" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">3</text>
    <text x="390" y="23" fill="#1F4B3F" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">Exploration</text>
    <text x="390" y="36" fill="#717D75" font-family="system-ui, -apple-system, sans-serif" font-size="9">Multi-Model Eval</text>

    <!-- Arrow 3 -->
    <path d="M 488 26 L 504 26 M 500 22 L 504 26 L 500 30" stroke="#A8A28E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Step 4 -->
    <circle cx="536" cy="26" r="10" fill="#2E705B"/>
    <text x="536" y="29.5" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">4</text>
    <text x="554" y="23" fill="#2E705B" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">Optimization</text>
    <text x="554" y="36" fill="#717D75" font-family="system-ui, -apple-system, sans-serif" font-size="9">Inference Delivery</text>
  </g>

  <!-- Definitions -->
  <defs>
    <filter id="shadow" x="48" y="44" width="704" height="400" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1F4B3F" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="historicalGrad" x1="220" y1="182" x2="220" y2="310" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1F4B3F" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#1F4B3F" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>
