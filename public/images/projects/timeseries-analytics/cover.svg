<svg width="800" height="480" viewBox="0 0 800 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer Rounded Canvas -->
  <rect width="800" height="480" rx="32" fill="#FBF8EE"/>
  
  <!-- Subtle Background Grid -->
  <g opacity="0.08">
    <line x1="80" y1="90" x2="720" y2="90" stroke="#1F4B3F" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="80" y1="170" x2="720" y2="170" stroke="#1F4B3F" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="80" y1="250" x2="720" y2="250" stroke="#1F4B3F" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="80" y1="330" x2="720" y2="330" stroke="#1F4B3F" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="160" y1="60" x2="160" y2="420" stroke="#1F4B3F" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="320" y1="60" x2="320" y2="420" stroke="#1F4B3F" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="480" y1="60" x2="480" y2="420" stroke="#1F4B3F" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="640" y1="60" x2="640" y2="420" stroke="#1F4B3F" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- Main Card Container -->
  <rect x="60" y="44" width="680" height="392" rx="24" fill="#FFFFFF" stroke="#E6DFCC" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Top Header Bar -->
  <g id="header">
    <!-- Left Category Pill -->
    <rect x="84" y="68" width="146" height="32" rx="16" fill="#E8F2EC"/>
    <circle cx="102" cy="84" r="4.5" fill="#1F4B3F"/>
    <text x="114" y="88" fill="#1F4B3F" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="0.06em">TIME-SERIES ML</text>
    
    <!-- Center Subtitle -->
    <text x="246" y="88" fill="#717D75" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">Predictive Analytics &amp; Feature Engine</text>
    
    <!-- Right Enterprise Badge -->
    <rect x="548" y="68" width="166" height="32" rx="16" fill="#F5EFE1"/>
    <circle cx="566" cy="84" r="4.5" fill="#996515"/>
    <text x="578" y="88" fill="#4A3E2C" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Enterprise Solution</text>
  </g>

  <!-- Middle Section: Chart (Left) and Metrics Cards (Right) -->
  <g id="middle-content">
    <!-- Left Chart Box -->
    <rect x="84" y="116" width="404" height="216" rx="18" fill="#FAF7EE" stroke="#E8E1CE" stroke-width="1.2"/>
    
    <!-- Chart Section Titles with wide margin -->
    <text x="106" y="142" fill="#717D75" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="0.04em">HISTORICAL DATA</text>
    <text x="320" y="142" fill="#2E705B" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="0.04em">FORECAST HORIZON</text>

    <!-- Chart Horizontal Grid Lines -->
    <line x1="106" y1="166" x2="466" y2="166" stroke="#E4DBC2" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="106" y1="210" x2="466" y2="210" stroke="#E4DBC2" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="106" y1="254" x2="466" y2="254" stroke="#E4DBC2" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="106" y1="294" x2="466" y2="294" stroke="#E4DBC2" stroke-width="1"/>

    <!-- Prediction Confidence Interval Fan (Band) -->
    <path d="M 286 206 Q 330 178 380 170 T 466 156 L 466 236 Q 380 228 330 224 Z" fill="#2E705B" fill-opacity="0.14"/>
    
    <!-- Historical Trend Area Gradient -->
    <path d="M 112 274 L 140 252 L 168 262 L 198 218 L 228 230 L 258 192 L 286 206 L 286 294 L 112 294 Z" fill="url(#histGrad)" opacity="0.35"/>
    
    <!-- Historical Actuals Line -->
    <path d="M 112 274 L 140 252 L 168 262 L 198 218 L 228 230 L 258 192 L 286 206" stroke="#1F4B3F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Historic Data Points (Circles) -->
    <circle cx="112" cy="274" r="3.5" fill="#FFFFFF" stroke="#1F4B3F" stroke-width="2"/>
    <circle cx="140" cy="252" r="3.5" fill="#FFFFFF" stroke="#1F4B3F" stroke-width="2"/>
    <circle cx="168" cy="262" r="3.5" fill="#FFFFFF" stroke="#1F4B3F" stroke-width="2"/>
    <circle cx="198" cy="218" r="3.5" fill="#FFFFFF" stroke="#1F4B3F" stroke-width="2"/>
    <circle cx="228" cy="230" r="3.5" fill="#FFFFFF" stroke="#1F4B3F" stroke-width="2"/>
    <circle cx="258" cy="192" r="3.5" fill="#FFFFFF" stroke="#1F4B3F" stroke-width="2"/>
    <circle cx="286" cy="206" r="4.5" fill="#2E705B" stroke="#FFFFFF" stroke-width="2"/>

    <!-- Vertical "NOW" Boundary Line -->
    <line x1="286" y1="152" x2="286" y2="294" stroke="#B87333" stroke-width="1.5" stroke-dasharray="4 3"/>
    <rect x="270" y="148" width="32" height="15" rx="7.5" fill="#B87333"/>
    <text x="286" y="159" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" text-anchor="middle">NOW</text>

    <!-- Forecast Median Dashed Line -->
    <path d="M 286 206 Q 330 182 376 190 T 466 178" stroke="#2E705B" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4"/>
    
    <!-- Forecast Prediction Points -->
    <circle cx="334" cy="191" r="3.5" fill="#2E705B"/>
    <circle cx="388" cy="188" r="3.5" fill="#2E705B"/>
    <circle cx="444" cy="180" r="3.5" fill="#2E705B"/>

    <!-- Feature Tags inside Chart (Bottom Left) -->
    <rect x="106" y="278" width="76" height="18" rx="9" fill="#FFFFFF" stroke="#E0D7BF" stroke-width="1"/>
    <text x="144" y="290.5" fill="#1F4B3F" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Trend &amp; Lags</text>

    <rect x="188" y="278" width="86" height="18" rx="9" fill="#FFFFFF" stroke="#E0D7BF" stroke-width="1"/>
    <text x="231" y="290.5" fill="#1F4B3F" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Rolling Stats</text>

    <!-- Right Side: 2 Clear Structured Cards -->
    <!-- Card 1: Model Benchmark -->
    <g transform="translate(504, 116)">
      <rect width="210" height="100" rx="16" fill="#FAF7EE" stroke="#E8E1CE" stroke-width="1.2"/>
      <circle cx="28" cy="34" r="14" fill="#E8F2EC"/>
      <path d="M 22 38 L 26 28 L 30 34 L 34 26" stroke="#1F4B3F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="50" y="28" fill="#717D75" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.04em">BENCHMARK</text>
      <text x="50" y="47" fill="#1F4B3F" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">LightGBM Model</text>
      
      <!-- Metric Tag -->
      <rect x="50" y="60" width="108" height="22" rx="11" fill="#1F4B3F"/>
      <text x="104" y="74.5" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">RMSE Optimized</text>
    </g>

    <!-- Card 2: Feature Pipeline -->
    <g transform="translate(504, 232)">
      <rect width="210" height="100" rx="16" fill="#FAF7EE" stroke="#E8E1CE" stroke-width="1.2"/>
      <circle cx="28" cy="34" r="14" fill="#F5EFE1"/>
      <circle cx="28" cy="34" r="6" stroke="#996515" stroke-width="2"/>
      <path d="M 28 24 L 28 26 M 28 42 L 28 44 M 18 34 L 20 34 M 36 34 L 38 34" stroke="#996515" stroke-width="2" stroke-linecap="round"/>
      <text x="50" y="28" fill="#717D75" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.04em">DATA PIPELINE</text>
      <text x="50" y="47" fill="#1F4B3F" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Large-Scale Prep</text>

      <!-- Strategy Tag -->
      <rect x="50" y="60" width="112" height="22" rx="11" fill="#F5EFE1" stroke="#DED4BF" stroke-width="1"/>
      <text x="106" y="74.5" fill="#4A3E2C" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">TimeSeriesSplit</text>
    </g>
  </g>

  <!-- Bottom Pipeline Bar: 4 stages cleanly spaced across 630px -->
  <g id="pipeline-flow" transform="translate(84, 348)">
    <rect width="630" height="60" rx="16" fill="#FAF7EE" stroke="#E8E1CE" stroke-width="1.2"/>
    
    <!-- Stage 1 -->
    <circle cx="28" cy="30" r="12" fill="#1F4B3F"/>
    <text x="28" y="34" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">1</text>
    <text x="48" y="26" fill="#1F4B3F" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">Ingestion</text>
    <text x="48" y="40" fill="#717D75" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">Raw Time-Series</text>

    <!-- Arrow 1 -->
    <path d="M 132 30 L 148 30 M 144 26 L 148 30 L 144 34" stroke="#B0A994" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Stage 2 -->
    <circle cx="180" cy="30" r="12" fill="#1F4B3F"/>
    <text x="180" y="34" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">2</text>
    <text x="200" y="26" fill="#1F4B3F" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">Feature Eng.</text>
    <text x="200" y="40" fill="#717D75" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">Lags &amp; Rolling</text>

    <!-- Arrow 2 -->
    <path d="M 284 30 L 300 30 M 296 26 L 300 30 L 296 34" stroke="#B0A994" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Stage 3 -->
    <circle cx="332" cy="30" r="12" fill="#1F4B3F"/>
    <text x="332" y="34" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">3</text>
    <text x="352" y="26" fill="#1F4B3F" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">Evaluation</text>
    <text x="352" y="40" fill="#717D75" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">Multi-Model Eval</text>

    <!-- Arrow 3 -->
    <path d="M 444 30 L 460 30 M 456 26 L 460 30 L 456 34" stroke="#B0A994" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Stage 4 -->
    <circle cx="492" cy="30" r="12" fill="#2E705B"/>
    <text x="492" y="34" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">4</text>
    <text x="512" y="26" fill="#2E705B" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">Optimization</text>
    <text x="512" y="40" fill="#717D75" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">Inference Ready</text>
  </g>

  <!-- Gradients & Filter Definitions -->
  <defs>
    <filter id="shadow" x="52" y="40" width="696" height="408" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1F4B3F" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="histGrad" x1="200" y1="192" x2="200" y2="294" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1F4B3F" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#1F4B3F" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>
